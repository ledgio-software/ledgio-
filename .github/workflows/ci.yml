name: CI

on:
  push:
    branches-ignore:
      - main  # main is covered by the migrate workflow; feature branches run CI on push
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend — typecheck / migrate / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accounting_db?schema=public&connection_limit=50&pool_timeout=10&connect_timeout=5&statement_timeout=30000
      # No external pooler in CI — DIRECT_URL == DATABASE_URL (see schema.prisma comment).
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/accounting_db?schema=public&connection_limit=50&pool_timeout=10&connect_timeout=5&statement_timeout=30000
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      BROADCAST_MASTER_SECRET: ci-only-broadcast-secret-not-for-production
      CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-encryption-key-not-for-production
      # Jest runs the entire test suite in a single Node process; the default
      # heap (~1.5 GB) is not enough. 4 GB keeps the runner well within the
      # 7 GB available on ubuntu-latest.
      NODE_OPTIONS: '--max-old-space-size=4096'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type check
        run: npx tsc --noEmit -p .

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend — typecheck / build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check & Vite build
        run: npm run build
