# Render Blueprint for the Ledgio backend API.
#
# How to use: go to https://dashboard.render.com -> "New +" -> "Blueprint",
# connect this GitHub repo, and Render will read this file and provision
# everything below. Env vars marked `sync: false` are left blank here on
# purpose - Render will prompt you to fill them in during setup (nothing
# secret is committed to the repo). Vars marked `generateValue: true` are
# auto-generated by Render itself.
#
# Only the backend is deployed here - the frontend (Vite/React SPA) is a
# separate static-hosting concern (Render Static Site, Vercel, Netlify, etc.)
# not covered by this file.
#
# Database: Postgres is NOT provisioned by this Blueprint - it lives on Neon
# (https://console.neon.tech -> project -> "Connect"), so customer data is not
# on Render and survives moving the backend between Render accounts:
#   - DATABASE_URL: the POOLED connection string (host contains "-pooler") -
#     what the app uses for normal runtime queries.
#   - DIRECT_URL: the DIRECT (non-pooled) connection string - required for
#     `prisma migrate deploy`. See backend/prisma/schema.prisma's `directUrl`.
# Both are required - Prisma errors on migrate commands if DIRECT_URL is
# missing once directUrl is declared in the schema.
#
# Moving to a different Render account: copy every `sync: false` value below
# from the old service's Environment tab. JWT_SECRET, BROADCAST_MASTER_SECRET
# and CREDENTIAL_ENCRYPTION_KEY in particular MUST be the same values as
# before - a new CREDENTIAL_ENCRYPTION_KEY makes every saved GRA credential in
# the database undecryptable, and a new BROADCAST_MASTER_SECRET changes the
# admin console passcode. The new account gets a new *.onrender.com URL: set
# BASE_URL to it, and point Vercel's VITE_API_BASE_URL (frontend + hub) and
# the Paystack/Mono webhook URLs at it.

services:
  # Redis - used for distributed rate limiting and caching (tenant lookups,
  # JWT revocation list). See backend/src/config/redis.ts.
  - type: keyvalue
    name: ledgio-redis
    plan: free
    ipAllowList: [] # empty = only accessible from other services in this Render account/region

  # The backend API itself.
  - type: web
    name: ledgio-backend
    runtime: node
    rootDir: backend
    plan: free # Downgraded 2026-11-01 from starter to stop paying while there
    # are no active users. Trade-offs on free: the service sleeps when idle
    # (~1 min cold start), and Render blocks outbound SMTP, so Gmail email
    # (EMAIL_USER/EMAIL_PASS below: verification, password reset, invoices)
    # will not send. Set back to `starter` to restore both.
    region: oregon
    # `preDeployCommand` isn't available on the free plan, so migrations ran
    # as the last build step there instead. Starter+ can move
    # `prisma migrate deploy` to `preDeployCommand` (runs closer to deploy
    # time and won't block a build from completing if a migration fails) -
    # not yet done, buildCommand below still works fine as-is.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production

      # Paste the two Neon connection strings - see the header comment above
      # for which is which.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ledgio-redis
          property: connectionString

      # Copy these from the existing deployment - do NOT let Render generate
      # new ones (see the header comment). Only on a brand-new install with an
      # empty database is a fresh random value fine.
      - key: JWT_SECRET
        sync: false
      - key: BROADCAST_MASTER_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

      # This service's own public URL (e.g. https://ledgio-backend-xxxx.onrender.com),
      # used by the keep-alive ping. Set it once Render shows the URL.
      - key: BASE_URL
        sync: false

      # The deployed frontend's real URL (Vercel). Not secret - safe to commit.
      - key: APP_URL
        value: "https://ledgio-fawn.vercel.app"
      - key: CORS_ALLOWED_ORIGINS # comma-separated frontend origin(s); falls back to APP_URL if unset
        value: "https://ledgio-fawn.vercel.app"
      - key: TRUST_PROXY # Render puts its own proxy in front of every web service
        value: "1"

      # All optional - each feature cleanly reports "not configured" instead
      # of faking data if left blank. Fill in only the ones you're using.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MONO_SECRET_KEY
        sync: false
      - key: MONO_WEBHOOK_SECRET
        sync: false
      - key: FX_RATE_API_KEY
        sync: false
      # Direct Gmail SMTP (nodemailer) - only works on Starter+ (blocked on the
      # current free plan; see the plan comment above). EMAIL_PASS must be a Gmail App Password
      # (https://myaccount.google.com/apppasswords), not the real login password.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_USER
        sync: false
      - key: SMS_GATEWAY_PASS
        sync: false
      - key: SMS_SENDER_ID
        sync: false

      - key: OTEL_ENABLED
        value: "false" # no OTLP collector deployed alongside this blueprint;
        # flip to "true" and set OTEL_EXPORTER_OTLP_ENDPOINT if you stand one up
